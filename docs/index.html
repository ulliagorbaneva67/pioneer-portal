<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102d23">
  <title>ПИОНЕР. Внутренний портал</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#overview"><span class="brand-mark">П</span><span>ПИОНЕР</span></a>
    <nav class="main-nav" id="mainNav">
      <span class="nav-group">Главное</span><a href="#overview" data-route="overview">Обзор</a>
      <span class="nav-group">Работа</span><a href="#tasks" data-route="tasks">Задачи</a><a href="#completed" data-route="completed">Выполненные</a><a href="#calendar" data-route="calendar">Календарь</a><a href="#messages" data-route="messages">Сообщения</a>
      <span class="nav-group">Люди</span><a href="#employees" data-route="employees">Сотрудники</a><a href="#feed" data-route="feed">Новости</a>
      <span class="nav-group">Для руководства</span><a href="#analytics" data-route="analytics">Аналитика</a>
      <span class="nav-group">Служебное</span><a href="#settings" data-route="settings">Настройки</a>
    </nav>
    <div class="sidebar-note"><strong>Интерактивная версия</strong>Данные сохраняются в этом браузере.</div>
  </aside>
  <div class="page-shell">
    <header class="topbar">
      <button class="menu-button" id="menuButton" type="button" aria-label="Открыть меню">☰</button>
      <div><div class="topbar-kicker">Рабочее пространство</div><strong>ПИОНЕР. Внутренний портал</strong></div>
      <div class="top-counters"><a href="#tasks">Мои задачи <strong id="taskCounter">0</strong></a><button data-action="notifications">Новые <strong id="noticeCounter">0</strong></button></div>
      <button class="notification-bell" data-action="notifications" title="Уведомления">🔔<span class="notification-count" id="noticeBadge">0</span></button>
      <button class="profile-avatar" data-action="profile" id="profileAvatar" title="Сменить профиль">А</button>
    </header>
    <main class="content" id="app" tabindex="-1"></main>
  </div>
  <div class="menu-overlay" id="menuOverlay"></div>
  <div class="toast-stack" id="toasts" aria-live="polite"></div>
  <dialog id="modal"><button class="modal-close" data-action="close-modal" aria-label="Закрыть">×</button><div id="modalBody"></div></dialog>
  <script src="app.js"></script>
</body>
</html>
